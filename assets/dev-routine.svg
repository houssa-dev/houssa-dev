<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Houssaine developer routine</title><desc id="desc">A visual developer routine showing learning, practice, building and sharing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfeff"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.t{fill:#0f172a}.s{fill:#64748b}.p{fill:#fff;stroke:#cbd5e1}.blue{fill:#0369a1}.cyan{fill:#0e7490}.green{fill:#15803d}</style>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/><g class="m"><rect x="40" y="32" width="1120" height="70" rx="14" class="p"/><circle cx="67" cy="60" r="6" fill="#fb7185"/><circle cx="88" cy="60" r="6" fill="#fbbf24"/><circle cx="109" cy="60" r="6" fill="#34d399"/><text x="136" y="65" class="t" font-size="14" font-weight="800">houssa-dev@github: ~/daily-routine</text><text x="1130" y="65" class="green" text-anchor="end" font-size="11">SYSTEM: IMPROVING</text>
  <text x="62" y="152" class="cyan" font-size="11" font-weight="800">05 / DEVELOPMENT LOOP</text><text x="62" y="190" class="t" font-size="25" font-weight="900">HOW I TURN CURIOSITY INTO SKILL</text><text x="62" y="217" class="s" font-size="12">A simple system: learn something, use it, then make it better.</text>
  <path d="M230 310H970" stroke="#bae6fd" stroke-width="5" stroke-linecap="round"/><g><circle cx="230" cy="310" r="48" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><text x="230" y="304" text-anchor="middle" class="blue" font-size="20" font-weight="900">01</text><text x="230" y="326" text-anchor="middle" class="blue" font-size="10" font-weight="800">LEARN</text><text x="230" y="390" text-anchor="middle" class="t" font-size="15" font-weight="900">Explore</text><text x="230" y="410" text-anchor="middle" class="s" font-size="10">New concepts</text></g>
  <g><circle cx="477" cy="310" r="48" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="477" y="304" text-anchor="middle" class="cyan" font-size="20" font-weight="900">02</text><text x="477" y="326" text-anchor="middle" class="cyan" font-size="10" font-weight="800">PRACTICE</text><text x="477" y="390" text-anchor="middle" class="t" font-size="15" font-weight="900">Try</text><text x="477" y="410" text-anchor="middle" class="s" font-size="10">Code every day</text></g>
  <g><circle cx="723" cy="310" r="48" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="723" y="304" text-anchor="middle" class="blue" font-size="20" font-weight="900">03</text><text x="723" y="326" text-anchor="middle" class="blue" font-size="10" font-weight="800">BUILD</text><text x="723" y="390" text-anchor="middle" class="t" font-size="15" font-weight="900">Create</text><text x="723" y="410" text-anchor="middle" class="s" font-size="10">Useful projects</text></g>
  <g><circle cx="970" cy="310" r="48" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#g)"/><text x="970" y="304" text-anchor="middle" class="green" font-size="20" font-weight="900">04</text><text x="970" y="326" text-anchor="middle" class="green" font-size="10" font-weight="800">SHARE</text><text x="970" y="390" text-anchor="middle" class="t" font-size="15" font-weight="900">Grow</text><text x="970" y="410" text-anchor="middle" class="s" font-size="10">With the community</text><circle cx="1012" cy="268" r="5" fill="#22c55e"><animate attributeName="opacity" values=".4;1;.4" dur="1.4s" repeatCount="indefinite"/></circle></g></g>
</svg>
