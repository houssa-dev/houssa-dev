<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Houssaine open source hub</title><desc id="desc">A visual board inviting visitors to explore Houssaine's work and connect on GitHub.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.w{fill:#f8fafc}.s{fill:#a5b4fc}.p{fill:#172554;stroke:#4f46e5}.violet{fill:#a78bfa}.green{fill:#4ade80}</style>
  <rect width="1200" height="450" rx="28" fill="url(#bg)"/><g class="m"><rect x="42" y="34" width="1116" height="68" rx="14" fill="#0f172a" stroke="#3730a3"/><circle cx="68" cy="61" r="6" fill="#fb7185"/><circle cx="89" cy="61" r="6" fill="#fbbf24"/><circle cx="110" cy="61" r="6" fill="#34d399"/><text x="136" y="66" class="w" font-size="14" font-weight="800">houssa-dev@github: ~/open-source</text><text x="1130" y="66" class="green" text-anchor="end" font-size="11">WELCOME</text>
  <rect x="42" y="136" width="652" height="268" rx="18" class="p"/><text x="72" y="174" class="violet" font-size="11" font-weight="800">THE WORKSPACE</text><text x="72" y="216" class="w" font-size="28" font-weight="900">PROJECTS START HERE.</text><text x="72" y="248" class="s" font-size="13">This profile is the home for experiments,</text><text x="72" y="270" class="s" font-size="13">new skills, and projects that grow over time.</text><rect x="72" y="310" width="214" height="45" rx="9" fill="#312e81" stroke="#a78bfa"/><text x="179" y="338" class="w" text-anchor="middle" font-size="11" font-weight="800">EXPLORE REPOSITORIES</text><path d="M545 318l28-60 28 60z" fill="#4f46e5" stroke="#a78bfa" stroke-width="2"/><path d="M573 258v-35" stroke="#a78bfa" stroke-width="3"/><circle cx="573" cy="211" r="9" fill="#4ade80" filter="url(#g)"><animate attributeName="opacity" values=".4;1;.4" dur="1.6s" repeatCount="indefinite"/></circle>
  <rect x="724" y="136" width="434" height="124" rx="18" class="p"/><text x="752" y="173" class="green" font-size="11" font-weight="800">LET'S CONNECT</text><text x="752" y="206" class="w" font-size="18" font-weight="900">FOLLOW THE JOURNEY</text><text x="752" y="230" class="s" font-size="11">Every new project will be shared here.</text>
  <rect x="724" y="280" width="434" height="124" rx="18" class="p"/><text x="752" y="317" class="violet" font-size="11" font-weight="800">OPEN INVITATION</text><text x="752" y="350" class="w" font-size="18" font-weight="900">BUILD • LEARN • CONNECT</text><text x="752" y="374" class="s" font-size="11">Thanks for stopping by.</text></g>
</svg>
