<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="About Elhoussaine Ahabchane"><defs>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e0703a"/><stop offset=".6" stop-color="#f2a74b"/><stop offset="1" stop-color="#f2a74b" stop-opacity="0"/></linearGradient>
<radialGradient id="flare" cx="82%" cy="30%" r="60%"><stop stop-color="#e0703a" stop-opacity=".22"/><stop offset=".5" stop-color="#e0703a" stop-opacity=".05"/><stop offset="1" stop-color="#0d0b0a" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<style>
.label{font:600 10px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f2a74b;letter-spacing:2.2px}
.muted{font:13px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#a8968a}
.chip{font:600 11px 'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;fill:#f6ead9}
.mono{font:12px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#a8968a}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .9s cubic-bezier(.22,.8,.2,1) both}
.fade{animation:fade 1s cubic-bezier(.22,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.prompt{font:600 13px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#e0703a}.cmd{font:13px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f6ead9}
.out{font:13.5px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#d9cbbd}.key{font:600 12px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#f2a74b}.val{font:12px ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#a8968a}
@keyframes blink{50%{opacity:0}}.cursor{animation:blink 1.1s steps(1) infinite}</style>
</defs><rect width="900" height="330" rx="22" fill="#15110f"/><rect x="6" y="6" width="888" height="318" rx="17" fill="#0d0b0a" stroke="#3a2a22"/><path d="M6 50h888" stroke="#261c17"/><circle cx="32" cy="28" r="5" fill="#e0703a"/><circle cx="50" cy="28" r="5" fill="#f2a74b"/><circle cx="68" cy="28" r="5" fill="#6f6058"/><text x="450.0" y="32" text-anchor="middle" class="mono" style="font-size:11px">~/houssa-dev — about.md</text><g class="fade"><text x="34" y="86" class="prompt">❯</text><text x="54" y="86" class="cmd">cat about.md</text></g><text x="54" y="118" class="out rise" style="animation-delay:0.15s">I'm a full-stack developer from Khénifra, Morocco. I build web</text><text x="54" y="140" class="out rise" style="animation-delay:0.23s">apps with Next.js, TypeScript, Tailwind CSS and Node.js, from</text><text x="54" y="162" class="out rise" style="animation-delay:0.31s">the database to the UI.</text><text x="54" y="206" class="out rise" style="animation-delay:0.47s">Lately I've been working on real products, not tutorials.</text><text x="54" y="228" class="out rise" style="animation-delay:0.55s">I like to start from the actual problem a business has, then</text><text x="54" y="250" class="out rise" style="animation-delay:0.63s">pick the simplest solution that holds up.</text><g class="fade" style="animation-delay:.9s"><text x="34" y="286" class="prompt">❯</text><text x="54" y="286" class="cmd">echo $FOCUS</text><text x="190" y="286" class="key">web apps for small businesses in Morocco</text><rect x="508" y="274" width="8" height="15" fill="#e0703a" class="cursor"/></g></svg>
