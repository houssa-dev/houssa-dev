<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Animated GitHub profile for Houssaine Ahabchane</title><desc id="desc">An animated sea wave moves through a GitHub-style contribution grid above Houssaine's developer profile.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
 <pattern id="tinyGrid" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#edf1f5"/><rect x="2" y="2" width="16" height="16" rx="3" fill="#dfe6ed" stroke="#cbd5e1"/></pattern>
 <pattern id="cells" width="22" height="22" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="16" height="16" rx="3" fill="#fff"/></pattern>
 <mask id="cellMask"><rect x="0" y="0" width="1000" height="170" fill="url(#cells)"/></mask>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#86efac"/><stop offset=".5" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.t{fill:#172554}.s{fill:#64748b}.p{fill:#fff;stroke:#cbd5e1}.indigo{fill:#4338ca}.green{fill:#15803d}.orange{fill:#ea580c}
@media(prefers-color-scheme:dark){.t{fill:#e0e7ff}.s{fill:#94a3b8}.p{fill:#111827;stroke:#334155}}
</style>
<rect width="1200" height="690" rx="28" fill="url(#bg)"/><rect x="30" y="26" width="1140" height="638" rx="23" class="p"/>
<g class="m"><rect x="52" y="48" width="1096" height="58" rx="13" fill="#0f172a"/><circle cx="78" cy="77" r="6" fill="#fb7185"/><circle cx="99" cy="77" r="6" fill="#fbbf24"/><circle cx="120" cy="77" r="6" fill="#34d399"/><text x="145" y="82" fill="#e2e8f0" font-size="14" font-weight="700">houssa-dev@github: ~/profile</text><text x="1120" y="82" text-anchor="end" fill="#86efac" font-size="11">FULL-STACK DEVELOPER</text>
<text x="72" y="143" class="t" font-size="13" font-weight="900">MY GITHUB ACTIVITY</text><text x="1128" y="143" class="s" text-anchor="end" font-size="10">ANIMATED CONTRIBUTION WAVE</text>
<rect x="72" y="162" width="1056" height="182" rx="14" class="p"/><g transform="translate(106 190)"><rect width="990" height="132" rx="8" fill="url(#tinyGrid)"/>
<g mask="url(#cellMask)"><path d="M-120 79 C30 10 135 145 265 74 S495 14 615 78 S850 145 1110 43 L1110 180 L-120 180Z" fill="url(#wave)"><animateTransform attributeName="transform" type="translate" values="-80 0;80 0;-80 0" dur="5.4s" repeatCount="indefinite"/></path><path d="M-100 110 C100 48 210 178 365 108 S590 44 740 110 S950 162 1110 88 L1110 180 L-100 180Z" fill="#16a34a" opacity=".7"><animateTransform attributeName="transform" type="translate" values="90 0;-90 0;90 0" dur="7s" repeatCount="indefinite"/></path></g>
<path d="M-16 73 C130 5 235 145 365 69 S595 17 715 74 S920 139 1030 47" fill="none" stroke="#dcfce7" stroke-width="2" stroke-opacity=".9"><animateTransform attributeName="transform" type="translate" values="-80 0;80 0;-80 0" dur="5.4s" repeatCount="indefinite"/></path></g>
<text x="84" y="369" class="s" font-size="10">LESS</text><rect x="126" y="357" width="14" height="14" rx="3" fill="#dfe6ed"/><rect x="146" y="357" width="14" height="14" rx="3" fill="#bbf7d0"/><rect x="166" y="357" width="14" height="14" rx="3" fill="#86efac"/><rect x="186" y="357" width="14" height="14" rx="3" fill="#22c55e"/><rect x="206" y="357" width="14" height="14" rx="3" fill="#15803d"/><text x="230" y="369" class="s" font-size="10">MORE</text>
<rect x="72" y="402" width="504" height="226" rx="16" class="p"/><text x="96" y="434" class="green" font-size="12" font-weight="900">$ cat about-me.txt</text><text x="96" y="467" class="t" font-size="22" font-weight="900">Hi, I’m Houssaine.</text><text x="96" y="497" class="s" font-size="13">A Full-Stack Developer focused on building</text><text x="96" y="518" class="s" font-size="13">clean, useful and reliable web experiences.</text><rect x="96" y="552" width="182" height="40" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="187" y="577" class="green" text-anchor="middle" font-size="11" font-weight="900">BUILDING EVERY DAY</text><text x="96" y="613" class="s" font-size="10">// based in Morocco · open to opportunities</text>
<rect x="600" y="402" width="528" height="226" rx="16" class="p"/><rect x="622" y="424" width="484" height="38" rx="9" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="645" cy="443" r="5" fill="#fb7185"/><circle cx="662" cy="443" r="5" fill="#fbbf24"/><circle cx="679" cy="443" r="5" fill="#34d399"/><text x="702" y="448" class="indigo" font-size="12" font-weight="900">developer.ts</text><text x="626" y="498" class="s" font-size="12">01</text><text x="665" y="498" class="indigo" font-size="15" font-weight="900">const</text><text x="716" y="498" class="t" font-size="15">houssaine = {</text><text x="626" y="528" class="s" font-size="12">02</text><text x="665" y="528" class="indigo" font-size="15" font-weight="900">role:</text><text x="720" y="528" class="orange" font-size="15"> "Full-Stack Developer",</text><text x="626" y="558" class="s" font-size="12">03</text><text x="665" y="558" class="indigo" font-size="15" font-weight="900">focus:</text><text x="728" y="558" class="orange" font-size="15"> "web applications",</text><text x="626" y="588" class="s" font-size="12">04</text><text x="665" y="588" class="indigo" font-size="15" font-weight="900">status:</text><text x="736" y="588" class="orange" font-size="15"> "building"</text><text x="665" y="614" class="t" font-size="15">};</text></g>
</svg>
