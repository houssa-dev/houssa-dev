<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Houssaine Ahabchane developer console</title><desc id="desc">A personal developer profile in a modern terminal interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2ff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#c7d2fe" stroke-opacity=".45"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.title{fill:#172554}.text{fill:#334155}.muted{fill:#64748b}.indigo{fill:#4f46e5}.orange{fill:#ea580c}.panel{fill:#fff;stroke:#cbd5e1}.code{fill:#0f172a}
    @media(prefers-color-scheme:dark){.title{fill:#e0e7ff}.text{fill:#cbd5e1}.muted{fill:#94a3b8}.panel{fill:#111827;stroke:#334155}.code{fill:#f8fafc}}
  </style>
  <rect width="1200" height="650" rx="28" fill="url(#bg)"/><rect width="1200" height="650" rx="28" fill="url(#grid)"/>
  <rect x="34" y="28" width="1132" height="594" rx="22" class="panel"/>
  <g class="mono"><rect x="58" y="52" width="1084" height="62" rx="14" fill="#0f172a"/><circle cx="82" cy="83" r="7" fill="#fb7185"/><circle cx="105" cy="83" r="7" fill="#fbbf24"/><circle cx="128" cy="83" r="7" fill="#34d399"/><text x="152" y="88" fill="#e2e8f0" font-size="14">houssa-dev@github: ~/profile</text><text x="1114" y="88" fill="#a5b4fc" text-anchor="end" font-size="12">PROFILE ONLINE</text></g>
  <g class="mono"><text x="74" y="156" class="indigo" font-size="12" font-weight="800">01 / HELLO, WORLD</text><text x="74" y="196" class="title" font-size="31" font-weight="900">HOUSSAINE AHABCHANE</text><text x="74" y="222" class="muted" font-size="13">Developer • Learner • Builder</text><line x1="74" y1="244" x2="1126" y2="244" stroke="#cbd5e1"/></g>
  <g class="mono"><rect x="74" y="272" width="478" height="292" rx="16" class="panel"/><text x="98" y="304" class="orange" font-size="12" font-weight="800">$ whoami</text><text x="98" y="337" class="title" font-size="22" font-weight="900">Building my path in tech.</text><text x="98" y="367" class="text" font-size="13">I enjoy learning by creating real projects,</text><text x="98" y="388" class="text" font-size="13">solving problems, and improving one step at a time.</text><rect x="98" y="424" width="183" height="42" rx="9" fill="#eef2ff" stroke="#a5b4fc"/><text x="189" y="450" class="indigo" text-anchor="middle" font-size="11" font-weight="800">BASED IN MOROCCO</text><rect x="293" y="424" width="163" height="42" rx="9" fill="#fff7ed" stroke="#fdba74"/><text x="374" y="450" class="orange" text-anchor="middle" font-size="11" font-weight="800">OPEN TO LEARN</text><text x="98" y="525" class="muted" font-size="11">// follow the journey on GitHub</text></g>
  <g class="mono"><rect x="580" y="272" width="546" height="292" rx="16" class="panel"/><rect x="602" y="294" width="502" height="45" rx="10" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="624" cy="316" r="5" fill="#fb7185"/><circle cx="642" cy="316" r="5" fill="#fbbf24"/><circle cx="660" cy="316" r="5" fill="#34d399"/><text x="682" y="321" class="indigo" font-size="13" font-weight="800">about-me.js</text><text x="1090" y="321" class="muted" text-anchor="end" font-size="10">CURRENT CONFIG</text><text x="612" y="378" class="muted" font-size="13">01</text><text x="650" y="378" class="indigo" font-size="16" font-weight="800">const</text><text x="700" y="378" class="code" font-size="16">houssaine = {</text><text x="612" y="414" class="muted" font-size="13">02</text><text x="650" y="414" class="indigo" font-size="16" font-weight="800">focus:</text><text x="719" y="414" class="orange" font-size="16"> "web development",</text><text x="612" y="450" class="muted" font-size="13">03</text><text x="650" y="450" class="indigo" font-size="16" font-weight="800">mindset:</text><text x="737" y="450" class="orange" font-size="16"> "keep learning",</text><text x="612" y="486" class="muted" font-size="13">04</text><text x="650" y="486" class="indigo" font-size="16" font-weight="800">goal:</text><text x="710" y="486" class="orange" font-size="16"> "ship useful projects"</text><text x="650" y="522" class="code" font-size="16">};</text><circle cx="1084" cy="492" r="5" fill="#4f46e5" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.5s" repeatCount="indefinite"/></circle></g>
</svg>
