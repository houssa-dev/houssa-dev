<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Mission control for Houssaine Ahabchane</title><desc id="desc">A mission control dashboard for Houssaine's projects, development goals and availability.</desc>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#c7d2fe" stroke-opacity=".5"/></pattern><filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.t{fill:#172554}.s{fill:#64748b}.p{fill:#fff;stroke:#cbd5e1}.violet{fill:#4338ca}.green{fill:#15803d}.orange{fill:#ea580c}</style>
<rect width="1200" height="490" rx="28" fill="#f8fafc"/><rect width="1200" height="490" rx="28" fill="url(#grid)"/><g class="m"><rect x="42" y="34" width="1116" height="68" rx="14" class="p"/><circle cx="68" cy="61" r="6" fill="#fb7185"/><circle cx="89" cy="61" r="6" fill="#fbbf24"/><circle cx="110" cy="61" r="6" fill="#34d399"/><text x="136" y="66" class="t" font-size="14" font-weight="800">houssa-dev@github: ~/mission-control</text><text x="1130" y="66" class="green" text-anchor="end" font-size="11">OPEN TO OPPORTUNITIES</text>
<rect x="42" y="136" width="680" height="304" rx="18" class="p"/><text x="70" y="172" class="violet" font-size="11" font-weight="900">FEATURED WORKSPACE</text><text x="70" y="213" class="t" font-size="27" font-weight="900">PROJECTS IN PROGRESS</text><text x="70" y="243" class="s" font-size="13">Building full-stack projects that turn ideas</text><text x="70" y="264" class="s" font-size="13">into useful, real-world web applications.</text><rect x="70" y="304" width="176" height="40" rx="8" fill="#eef2ff" stroke="#a5b4fc"/><text x="158" y="329" class="violet" text-anchor="middle" font-size="10" font-weight="900">WEB APPS</text><rect x="258" y="304" width="176" height="40" rx="8" fill="#dcfce7" stroke="#86efac"/><text x="346" y="329" class="green" text-anchor="middle" font-size="10" font-weight="900">FULL STACK</text><rect x="70" y="363" width="392" height="44" rx="8" fill="#fff7ed" stroke="#fed7aa"/><text x="266" y="390" class="orange" text-anchor="middle" font-size="11" font-weight="900">NEXT PROJECT: COMING SOON</text><path d="M584 324l31-68 31 68z" fill="#c4b5fd" stroke="#4338ca" stroke-width="2"/><path d="M615 256v-38" stroke="#4338ca" stroke-width="3"/><circle cx="615" cy="205" r="9" fill="#4ade80" filter="url(#g)"><animate attributeName="opacity" values=".4;1;.4" dur="1.4s" repeatCount="indefinite"/></circle>
<rect x="752" y="136" width="406" height="138" rx="18" class="p"/><text x="780" y="172" class="orange" font-size="11" font-weight="900">CURRENT MISSION</text><text x="780" y="207" class="t" font-size="18" font-weight="900">LEARN · BUILD · IMPROVE</text><text x="780" y="232" class="s" font-size="11">Creating every day and shipping better work.</text>
<rect x="752" y="302" width="406" height="138" rx="18" class="p"/><text x="780" y="338" class="green" font-size="11" font-weight="900">AVAILABILITY</text><text x="780" y="373" class="t" font-size="18" font-weight="900">OPEN TO COLLABORATE</text><text x="780" y="398" class="s" font-size="11">Let’s connect and build something great.</text><circle cx="1122" cy="338" r="5" fill="#22c55e" filter="url(#g)"><animate attributeName="opacity" values=".4;1;.4" dur="1.5s" repeatCount="indefinite"/></circle></g>
